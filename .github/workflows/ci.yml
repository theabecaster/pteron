name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pteron-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests never run on macdesk: they build on GitHub's own machines. Pushes to main and
  # manual runs build on macdesk (self-hosted, latest Xcode). Fork pull requests also need the
  # owner's approval before anything runs; read the workflow diff before approving one.
  build:
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-15' || fromJSON('["self-hosted","macOS","ARM64","macdesk","rexduo"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Trusted runs share macdesk with the lanes. Take ~/rexduo-build.lock as lane `ci`, with the
      # rule tools/gate-branch.sh uses, and give it back in the last step (always, but only when
      # the lane file still reads `ci`).
      - name: Take the build lock
        if: github.event_name != 'pull_request'
        run: |
          for i in $(seq 1 90); do
            N=$(cat ~/rexduo-build.next 2>/dev/null)
            if [ -z "$N" ] || [ "$N" = ci ]; then
              if mkdir ~/rexduo-build.lock 2>/dev/null; then
                echo ci > ~/rexduo-build.lock/lane
                rm -f ~/rexduo-build.next
                echo "lock taken as ci"
                exit 0
              fi
            fi
            [ $((i % 10)) -eq 1 ] && echo "waiting: lock held by $(cat ~/rexduo-build.lock/lane 2>/dev/null || echo unknown)"
            sleep 30
          done
          echo "lock timeout"
          exit 1
      # Packages run at normal priority: a wall-time test passes at background priority when it
      # should fail (F0 H-F0c).
      - name: RexKit tests
        run: swift test --package-path Packages/RexKit
      - name: RexGlance tests
        run: swift test --package-path Packages/RexGlance
      - name: Ghostty framework
        if: github.event_name != 'pull_request'
        run: |
          # Trusted runs only: the cache lives outside the workspace and persists between runs.
          CACHE="$HOME/actions-runner/pteron-vendor"
          mkdir -p "$CACHE"
          ln -sfn "$CACHE" Vendor
          scripts/build-ghostty.sh
      - name: App tests
        if: github.event_name != 'pull_request'
        run: |
          /opt/homebrew/bin/xcodegen generate --quiet
          SIM=$(xcrun simctl create "ci-pteron-$GITHUB_RUN_ID" "iPhone 17")
          trap 'xcrun simctl delete "$SIM" >/dev/null 2>&1' EXIT
          taskpolicy -b xcodebuild test -project Pteron.xcodeproj -scheme Pteron -destination "id=$SIM" \
            -derivedDataPath "$HOME/actions-runner/pteron-dd" -quiet
      - name: Give the build lock back
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ "$(cat ~/rexduo-build.lock/lane 2>/dev/null)" = ci ]; then
            rm -rf ~/rexduo-build.lock && echo "lock released"
          else
            echo "lock is not ours; left alone"
          fi

  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # No earlier product name outside the places that must keep one. It reads every tracked
      # file, the app's too, and needs only git and awk, so it runs here, on every pull request.
      - name: Brand check
        run: scripts/check-brand.sh --self-test && scripts/check-brand.sh
      - name: Helper tests
        working-directory: Relay
        run: cargo test --locked
