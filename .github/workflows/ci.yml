name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pteron-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything runs on GitHub's own machines; the owner's Macs are not used. The repository is
  # public, so these runners cost nothing. Fork pull requests run only after the owner approves
  # them; read the workflow diff before approving one. No step uses a secret.
  build:
    # GitHub's macOS 27 image with Xcode 27 (arm64, which the Ghostty build needs).
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The image's default Xcode is 27.1; the app is built with 27.2.
      - name: Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          xcrun simctl list runtimes
      # Packages run at normal priority: a wall-time test passes at background priority when it
      # should fail (F0 H-F0c).
      - name: RexKit tests
        run: swift test --package-path Packages/RexKit
      - name: RexGlance tests
        run: swift test --package-path Packages/RexGlance
      # Only the built framework and its stamp are cached, not Zig or the Ghostty checkout. The
      # key covers what the stamp is made from (the pins and the patches) and the script that
      # writes it, so a hit has a matching stamp and build-ghostty.sh does nothing.
      - name: Restore the Ghostty framework
        uses: actions/cache@v4
        with:
          path: |
            Vendor/GhosttyVt.xcframework
            Vendor/GhosttyVt.stamp
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ghostty.version', 'scripts/ghostty-patches/*.patch', 'scripts/check-ghostty.sh') }}
      - name: Ghostty framework
        run: scripts/build-ghostty.sh
      - name: XcodeGen
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate --quiet
      # A simulator made for this run, on the iOS 27.2 runtime, by its id: the framework's
      # simulator slice is arm64 only, so a generic destination would fail. One test process
      # (the scheme marks nothing parallelizable), as in the gate. The plain runtime only, as
      # in the gate: the image also has a 27.2 runtime for one model (…iOS-27-2-iPhone19-4,
      # the iPhone Duo), listed first on some runs, and the suite is not written for that
      # model's screen.
      - name: App tests
        run: |
          RUNTIMES=$(xcrun simctl list runtimes -j)
          RUNTIME=$(echo "$RUNTIMES" | jq -r '[.runtimes[] | select(.platform == "iOS" and (.version == "27.2" or (.version | startswith("27.2."))) and .isAvailable and (.identifier | test("SimRuntime\\.iOS-[0-9]+(-[0-9]+)*$")))] | first | .identifier // empty')
          [ -n "$RUNTIME" ] || { echo "no iOS 27.2 simulator runtime on this image"; exit 1; }
          DEVICE=$(echo "$RUNTIMES" | jq -r --arg r "$RUNTIME" '[.runtimes[] | select(.identifier == $r) | .supportedDeviceTypes[] | select(.productFamily == "iPhone")] | (map(select(.name == "iPhone 17")) + .) | first | .identifier // empty')
          [ -n "$DEVICE" ] || { echo "no iPhone device type for $RUNTIME"; exit 1; }
          SIM=$(xcrun simctl create "ci-pteron-$GITHUB_RUN_ID" "$DEVICE" "$RUNTIME")
          echo "simulator $SIM: $DEVICE on $RUNTIME"
          trap 'xcrun simctl delete "$SIM" >/dev/null 2>&1' EXIT
          xcodebuild test -project Pteron.xcodeproj -scheme Pteron -destination "id=$SIM" \
            -derivedDataPath build/dd -quiet -resultBundlePath build/tests.xcresult
      # -quiet names a failing test but not what failed in it: each failure's message, from the
      # result bundle, with the test's time. A Swift Testing test with arguments keeps its
      # messages a level down, under each argument.
      - name: What failed
        if: failure()
        run: |
          [ -d build/tests.xcresult ] || exit 0
          xcrun xcresulttool get test-results tests --path build/tests.xcresult | jq -r '.. | objects
            | select(.nodeType? == "Test Case" and .result == "Failed") | .name as $n | (.duration // "?") as $d
            | [.. | objects | select(.nodeType? == "Failure Message") | .name] | unique[] | "\($n) (\($d)): \(.)"'

  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # No earlier product name outside the places that must keep one. It reads every tracked
      # file, the app's too, and needs only git and awk, so it runs here, on every pull request.
      - name: Brand check
        run: scripts/check-brand.sh --self-test && scripts/check-brand.sh
      - name: Helper tests
        working-directory: Relay
        run: cargo test --locked
