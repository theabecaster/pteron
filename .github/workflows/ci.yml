name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rexduo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests never run on macdesk: they build on GitHub's own machines. Pushes to main and
  # manual runs build on macdesk (self-hosted, latest Xcode). Fork pull requests also need the
  # owner's approval before anything runs; read the workflow diff before approving one.
  build:
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-15' || fromJSON('["self-hosted","macOS","ARM64","macdesk","rexduo"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: RexKit tests
        run: swift test --package-path Packages/RexKit
      - name: Ghostty framework
        if: github.event_name != 'pull_request'
        run: |
          # Trusted runs only: the cache lives outside the workspace and persists between runs.
          CACHE="$HOME/actions-runner/rexduo-vendor"
          mkdir -p "$CACHE"
          ln -sfn "$CACHE" Vendor
          scripts/build-ghostty.sh
      - name: App tests
        if: github.event_name != 'pull_request'
        run: |
          /opt/homebrew/bin/xcodegen generate --quiet
          SIM=$(xcrun simctl create "ci-rexduo-$GITHUB_RUN_ID" "iPhone 17")
          trap 'xcrun simctl delete "$SIM" >/dev/null 2>&1' EXIT
          xcodebuild test -project RexDuo.xcodeproj -scheme RexDuo -destination "id=$SIM" \
            -derivedDataPath "$HOME/actions-runner/rexduo-dd" -quiet

  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Helper tests
        working-directory: Relay
        run: cargo test --locked
