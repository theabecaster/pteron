[package]
name = "rex-duo-helper"
version = "0.5.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Sends push notifications for the Rex server on this machine to the phone app."

[dependencies]
# One thread, no polling: everything waits on sockets, signals or the debounce timer.
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "macros", "signal", "io-util", "process", "sync"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Parses the response head of the small HTTP/1.1 client (src/net.rs). Already in the tree:
# the WebSocket client uses it.
httparse = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# ed25519 (update signatures) and SHA-256 (downloads).
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
