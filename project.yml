# Source of truth for RexConnect.xcodeproj, which is generated and not tracked.
# Run `xcodegen generate` after cloning and after adding, moving or deleting files.
name: RexConnect
options:
  bundleIdPrefix: dev.abrahamgonzalez
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: R2PVQ496X7
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  RexKit:
    path: Packages/RexKit
targets:
  RexConnect:
    type: application
    platform: iOS
    sources:
      - path: RexConnect
    dependencies:
      - package: RexKit
        product: RexKit
      # Built by scripts/build-ghostty.sh (static library, so nothing to embed).
      - framework: Vendor/GhosttyVt.xcframework
        embed: false
    # Stops with one actionable line when the framework was built from other pins than
    # scripts/ghostty.version, or the deployment target is too old for it, instead of a link
    # error, a silently stale engine or an app that fails at launch. (When the framework is
    # missing altogether, Xcode stops earlier with "There is no XCFramework found".)
    # It runs on every build (it takes a few milliseconds): with dependency analysis a patch
    # added to scripts/ghostty-patches, which is no input yet, would not run it again.
    preBuildScripts:
      - name: Check GhosttyVt.xcframework
        script: '"$SRCROOT/scripts/check-ghostty.sh" && touch "$SCRIPT_OUTPUT_FILE_0"'
        shell: /bin/zsh
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/check-ghostty.sh
          - $(SRCROOT)/scripts/ghostty.version
          - $(SRCROOT)/project.yml
          # Every patch by name: the script sandbox lets the check read only listed files, and
          # listing the folder doesn't cover the files in it. A patch that is missing here
          # stops the next build with a line that says so.
          - $(SRCROOT)/scripts/ghostty-patches/0001-tinyio-public-darwin-futex.patch
          - $(SRCROOT)/Vendor/GhosttyVt.stamp
          - $(SRCROOT)/Vendor/GhosttyVt.xcframework/Info.plist
        outputFiles:
          - $(DERIVED_FILE_DIR)/ghostty-checked
    # Push from Rex Connect Helper. Development signing keeps "development" (sandbox tokens);
    # exporting for App Store Connect switches it to production. Blocked-agent pushes use the
    # time-sensitive interruption level, which needs its own entitlement.
    entitlements:
      path: RexConnect/RexConnect.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        # The bundle id predates the rename. App Store Connect and the APNs topic depend on it.
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrahamgonzalez.rexduo
        PRODUCT_NAME: RexConnect
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: RexConnect/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # libghostty-vt's simdutf and highway are C++.
        OTHER_LDFLAGS: "-lc++"
  # Pure app logic (keymap, key encoding, layout math, prefs). Runs inside the app, which doesn't
  # connect while it hosts tests. Protocol tests live in Packages/RexKit (`swift test`).
  RexConnectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RexConnectTests
    dependencies:
      - target: RexConnect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrahamgonzalez.rexduo.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RexConnect.app/RexConnect"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  RexConnect:
    build:
      targets:
        RexConnect: all
        RexConnectTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RexConnectTests
    archive:
      config: Release
