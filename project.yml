name: RexDuo
options:
  bundleIdPrefix: dev.abrahamgonzalez
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: R2PVQ496X7
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.3
targets:
  RexDuo:
    type: application
    platform: iOS
    sources:
      - path: RexDuo
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      # Built by scripts/build-ghostty.sh (static library, so nothing to embed).
      - framework: Vendor/GhosttyVt.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrahamgonzalez.rexduo
        PRODUCT_NAME: RexDuo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: RexDuo/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # libghostty-vt's simdutf and highway are C++.
        OTHER_LDFLAGS: "-lc++"
  RexDuoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RexDuoTests
    dependencies:
      - target: RexDuo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrahamgonzalez.rexduo.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RexDuo.app/RexDuo"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  RexDuo:
    build:
      targets:
        RexDuo: all
        RexDuoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RexDuoTests
    archive:
      config: Release
