# Source of truth for Pteron.xcodeproj, which is generated and not tracked.
# Run `xcodegen generate` after cloning and after adding, moving or deleting files.
name: Pteron
options:
  bundleIdPrefix: dev.abrahamgonzalez
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: R2PVQ496X7
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The name under the icon and in the camera prompt, in both Info.plists. The same word as
    # GlanceModel's Brand.appName, which the app's tests hold it to.
    APP_DISPLAY_NAME: Pteron
packages:
  RexKit:
    path: Packages/RexKit
  # What the app shares with its extensions: the links that open the app and the snapshot the
  # widgets read (GlanceModel, Foundation only), and what the widgets draw with (GlanceUI, SwiftUI only).
  RexGlance:
    path: Packages/RexGlance
targets:
  Pteron:
    type: application
    platform: iOS
    sources:
      - path: Pteron
      # The app icon, an Icon Composer document. actool compiles it into the layered icon and
      # the flat ones older systems use.
      - path: Brand/AppIcon.icon
      # The intent the controls run. The system runs it in the app, so the app compiles it too.
      - path: PteronWidgets/OpenLinkIntent.swift
      # The agents' marks (custom symbols), which identify each agent wherever it is drawn
      # (GlanceUI's AgentGlyph; Brand/agents/README.md). Every target that draws an agent has them.
      - path: Brand/agents/AgentMarks.xcassets
    dependencies:
      - package: RexKit
        product: RexKit
      - package: RexGlance
        product: GlanceModel
      # The agents' glyphs (AgentGlyph), and the widgets' colors the app's tests hold to the app's.
      - package: RexGlance
        product: GlanceUI
      # The widgets and the controls. Embedded in the app (PlugIns), so every build and test of
      # the app builds it.
      - target: PteronWidgets
      # The watch app. Embedded in the app (Watch), so every build of the app builds it too.
      - target: PteronWatch
      # Built by scripts/build-ghostty.sh (static library, so nothing to embed).
      - framework: Vendor/GhosttyVt.xcframework
        embed: false
    # Stops with one actionable line when the framework was built from other pins than
    # scripts/ghostty.version, or the deployment target is too old for it, instead of a link
    # error, a silently stale engine or an app that fails at launch. (When the framework is
    # missing altogether, Xcode stops earlier with "There is no XCFramework found".)
    # It runs on every build (it takes a few milliseconds): with dependency analysis a patch
    # added to scripts/ghostty-patches, which is no input yet, would not run it again.
    preBuildScripts:
      - name: Check GhosttyVt.xcframework
        script: '"$SRCROOT/scripts/check-ghostty.sh" && touch "$SCRIPT_OUTPUT_FILE_0"'
        shell: /bin/zsh
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/check-ghostty.sh
          - $(SRCROOT)/scripts/ghostty.version
          - $(SRCROOT)/project.yml
          # Every patch by name: the script sandbox lets the check read only listed files, and
          # listing the folder doesn't cover the files in it. A patch that is missing here
          # stops the next build with a line that says so.
          - $(SRCROOT)/scripts/ghostty-patches/0001-tinyio-public-darwin-futex.patch
          - $(SRCROOT)/Vendor/GhosttyVt.stamp
          - $(SRCROOT)/Vendor/GhosttyVt.xcframework/Info.plist
        outputFiles:
          - $(DERIVED_FILE_DIR)/ghostty-checked
    # The helper's installer, which "Install" in the app runs on the user's computer, ships in the
    # app as setup.sh. Its one source is Relay/setup.sh; this copies it in on every build, so the
    # repository holds no second copy. A Release build stops without it. A Debug build goes on
    # (the unit tests then skip the check that compares the two).
    postBuildScripts:
      - name: Copy the helper installer
        script: |
          src="$SCRIPT_INPUT_FILE_0"
          dst="$SCRIPT_OUTPUT_FILE_0"
          if [ -f "$src" ]; then
            /bin/cp -f "$src" "$dst"
            /bin/chmod 0644 "$dst"
          elif [ "$CONFIGURATION" = "Debug" ]; then
            /bin/rm -f "$dst"
            echo "note: Relay/setup.sh is missing, so this build can't install the helper"
          else
            echo "error: Relay/setup.sh is missing; the app can't ship without the helper installer"
            exit 1
          fi
        shell: /bin/sh
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Relay/setup.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/setup.sh
    # Push from Beacon. Development signing keeps "development" (sandbox tokens);
    # exporting for App Store Connect switches it to production. Blocked-agent pushes use the
    # time-sensitive interruption level, which needs its own entitlement.
    entitlements:
      path: Pteron/Pteron.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        # Where the app writes the snapshot its widgets read (GlanceStore.appGroup).
        com.apple.security.application-groups:
          - group.dev.abrahamgonzalez.rexduo
    settings:
      base:
        # Keep the bundle id: App Store Connect and the APNs topic depend on it.
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrahamgonzalez.rexduo
        PRODUCT_NAME: Pteron
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Pteron/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # libghostty-vt's simdutf and highway are C++.
        OTHER_LDFLAGS: "-lc++"
  # The agents widget (Home Screen and Lock Screen) and the controls for Control Center, the Lock
  # Screen and the Action button. The widget reads the snapshot the app writes to the App Group;
  # the controls only open the app with a link (PteronWidgets/OpenLinkIntent.swift). So the
  # extension links neither RexKit nor GhosttyVt, and the Ghostty check stays on the app.
  PteronWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PteronWidgets
      # The agents' marks (custom symbols), which identify each agent wherever it is drawn
      # (GlanceUI's AgentGlyph; Brand/agents/README.md). Every target that draws an agent has them.
      - path: Brand/agents/AgentMarks.xcassets
    dependencies:
      - package: RexGlance
        product: GlanceModel
      - package: RexGlance
        product: GlanceUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    # The App Group it reads the snapshot from, and Data Protection Complete.
    # What hides a name, a place or a message is `.privacySensitive()` on its view: the system
    # draws those views redacted where it asks for privacy. The entitlement doesn't redact
    # anything. It makes Complete the default protection of files the extension itself creates
    # (it creates none; the app writes the snapshot, readable after the first unlock), and it
    # tells the system that this widget's content is protected while the phone is locked. That
    # iOS then shows the redacted views on a locked phone is checked on a device
    # (docs/glance.md, Privacy); a simulator has no passcode. This file's comments are the only
    # ones: XcodeGen writes the .entitlements file from the properties below.
    entitlements:
      path: PteronWidgets/PteronWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.abrahamgonzalez.rexduo
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrahamgonzalez.rexduo.widgets
        PRODUCT_NAME: PteronWidgets
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: PteronWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  # The watch app: a view of the agents, as the iPhone app last saw them (docs/glance.md, The
  # watch). It shows the snapshot the phone sends over WatchConnectivity and connects to
  # nothing itself, so it links neither RexKit nor GhosttyVt. It can't run without the iPhone app.
  PteronWatch:
    type: application
    platform: watchOS
    sources:
      - path: PteronWatch
      # The same icon as the app's.
      - path: Brand/AppIcon.icon
      # The mark, for the screen that has nothing to list.
      - path: PteronWidgets/Assets.xcassets
      # The agents' marks (custom symbols), which identify each agent wherever it is drawn
      # (GlanceUI's AgentGlyph; Brand/agents/README.md). Every target that draws an agent has them.
      - path: Brand/agents/AgentMarks.xcassets
    dependencies:
      - package: RexGlance
        product: GlanceModel
      - package: RexGlance
        product: GlanceUI
      - target: PteronWatchWidgets
    # The App Group on the watch: where the watch app writes the snapshot it was sent and its
    # complications read it. The same id as on the phone; a container is per device.
    entitlements:
      path: PteronWatch/PteronWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.abrahamgonzalez.rexduo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrahamgonzalez.rexduo.watchkitapp
        PRODUCT_NAME: PteronWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: PteronWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  # The watch's complications and its Smart Stack widget. They read the snapshot from the
  # watch's App Group. The circular, rectangular and inline families are the iPhone Lock
  # Screen's views, and the timeline is the iPhone widget's: the same files, compiled here too.
  PteronWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: PteronWatchWidgets
      - path: PteronWidgets/Views/AccessoryViews.swift
      - path: PteronWidgets/Views/GlanceStyle.swift
      - path: PteronWidgets/Provider.swift
      - path: PteronWidgets/Demo.swift
      - path: PteronWidgets/Assets.xcassets
      # The agents' marks (custom symbols), which identify each agent wherever it is drawn
      # (GlanceUI's AgentGlyph; Brand/agents/README.md). Every target that draws an agent has them.
      - path: Brand/agents/AgentMarks.xcassets
    dependencies:
      - package: RexGlance
        product: GlanceModel
      - package: RexGlance
        product: GlanceUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: PteronWatchWidgets/PteronWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.abrahamgonzalez.rexduo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrahamgonzalez.rexduo.watchkitapp.widgets
        PRODUCT_NAME: PteronWatchWidgets
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_FILE: PteronWatchWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  # The watch app's tests: its model, and every screen and complication drawn in every state.
  # They run in the watch app on a watchOS simulator, through the scheme PteronWatch.
  PteronWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: PteronWatchTests
      # The complications' views, which the tests draw.
      - path: PteronWatchWidgets/WatchGlanceWidget.swift
      - path: PteronWidgets/Views/AccessoryViews.swift
      - path: PteronWidgets/Views/GlanceStyle.swift
      - path: PteronWidgets/Provider.swift
      - path: PteronWidgets/Demo.swift
    dependencies:
      - target: PteronWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrahamgonzalez.rexduo.watchkitapp.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PteronWatch.app/PteronWatch"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # Pure app logic (keymap, key encoding, layout math, prefs). Runs inside the app, which doesn't
  # connect while it hosts tests. Protocol tests live in Packages/RexKit (`swift test`).
  PteronTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PteronTests
      # The control server the protocol tests run against, shared with the app's tests.
      - path: Packages/RexKit/Tests/RexKitTests/FakeRexServer.swift
      # The widgets' views, which the tests draw in every size, state and rendering mode.
      - path: PteronWidgets/Views
    dependencies:
      - target: Pteron
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrahamgonzalez.rexduo.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pteron.app/Pteron"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Pteron:
    build:
      targets:
        Pteron: all
        PteronTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PteronTests
    archive:
      config: Release
  # The watch app by itself, for a watchOS simulator: `build` builds it, `test` runs PteronWatchTests.
  PteronWatch:
    build:
      targets:
        PteronWatch: all
        PteronWatchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PteronWatchTests
    archive:
      config: Release
