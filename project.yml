# Source of truth for RexConnect.xcodeproj, which is generated and not tracked.
# Run `xcodegen generate` after cloning and after adding, moving or deleting files.
name: RexConnect
options:
  bundleIdPrefix: dev.abrahamgonzalez
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: R2PVQ496X7
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.3
  RexKit:
    path: Packages/RexKit
targets:
  RexConnect:
    type: application
    platform: iOS
    sources:
      - path: RexConnect
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: RexKit
        product: RexKit
    settings:
      base:
        # The bundle id predates the rename. App Store Connect and the APNs topic depend on it.
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrahamgonzalez.rexduo
        PRODUCT_NAME: RexConnect
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: RexConnect/Info.plist
        GENERATE_INFOPLIST_FILE: NO
schemes:
  RexConnect:
    build:
      targets:
        RexConnect: all
    run:
      config: Debug
    archive:
      config: Release
